name: build-sk-vad-asr-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sk-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: src
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Display NDK
        shell: bash
        run: echo "NDK=${ANDROID_NDK_LATEST_HOME}" && ls -d ${ANDROID_NDK_LATEST_HOME}

      - name: Build native libs (arm64-v8a)
        working-directory: src
        shell: bash
        run: |
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          cmake --version
          ./build-android-arm64-v8a.sh

      - name: Insert SK Parakeet model into assets
        working-directory: src
        shell: bash
        run: |
          set -e
          A=$PWD/android/SherpaOnnxVadAsr/app/src/main/assets
          D=$A/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
          mkdir -p $D
          BASE=https://huggingface.co/vibeide-dev/parakeet-tdt-0.6b-v3-sk-sherpa-onnx-int8/resolve/main
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt; do
            echo "downloading $f"
            curl -SL --retry 3 -o $D/$f $BASE/$f
          done
          ls -lh $D
          echo "downloading silero_vad.onnx"
          curl -SL --retry 3 -o $A/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -lh $A/silero_vad.onnx
          # overenie: model musi mat ~650MB
          SZ=$(stat -c%s $D/encoder.int8.onnx)
          if [ "$SZ" -lt 650000000 ]; then echo "CHYBA: encoder len $SZ bajtov"; exit 1; fi
          echo "encoder OK: $SZ"

      - name: Set asrModelType=40
        working-directory: src
        shell: bash
        run: |
          set -e
          F=android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt
          sed -i.bak 's/asrModelType = [0-9]*/asrModelType = 40/' $F
          grep -n 'asrModelType' $F

      - name: Tune for noisy environments (VAD threshold + mic source)
        working-directory: src
        shell: bash
        run: |
          set -e
          python3 - << 'PYEOF'
          # 1) VAD threshold 0.5 -> 0.65 (tvrdsie filtrovanie sumu)
          p = 'sherpa-onnx/kotlin-api/Vad.kt'
          t = open(p).read()
          n = t.count('threshold = 0.5F')
          t = t.replace('threshold = 0.5F', 'threshold = 0.65F')
          open(p, 'w').write(t)
          print(f'Vad.kt: replaced {n} threshold occurrences')

          # 2) MainActivity: MIC -> VOICE_RECOGNITION + NoiseSuppressor/AGC
          p = 'android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt'
          t = open(p).read()
          assert 'MediaRecorder.AudioSource.MIC' in t, 'audioSource not found'
          t = t.replace('MediaRecorder.AudioSource.MIC', 'MediaRecorder.AudioSource.VOICE_RECOGNITION')

          old = """        )
        return true
    }
    private fun processSamples()"""
          new = """        )
        // Turn on noise suppressor + AGC for noisy environments (outdoors/concerts)
        try {
            android.media.audiofx.NoiseSuppressor.create(audioRecord!!.audioSessionId)?.enabled = true
            android.media.audiofx.AutomaticGainControl.create(audioRecord!!.audioSessionId)?.enabled = true
        } catch (e: Exception) { }
        return true
    }
    private fun processSamples()"""
          if old not in t:
              # fallback: hladaj bez presnej indentacie
              import re
              m = re.search(r'\)\s*\n\s*return true\s*\n\s*\}\s*\n\s*private fun processSamples', t)
              assert m, 'initMicrophone anchor not found'
              print('WARN: fallback regex anchor used')
              t = t[:m.end()-len('private fun processSamples')] + new.split('private fun processSamples')[0].split('\n',1)[1].strip('\n') if False else t
              # jednoduchsie: vloz len pred 'return true'
              idx = t.find('numBytes * 2')
              idx2 = t.find('return true', idx)
              t = t[:idx2] + """// Turn on noise suppressor + AGC for noisy environments (outdoors/concerts)
        try {
            android.media.audiofx.NoiseSuppressor.create(audioRecord!!.audioSessionId)?.enabled = true
            android.media.audiofx.AutomaticGainControl.create(audioRecord!!.audioSessionId)?.enabled = true
        } catch (e: Exception) { }
        """ + t[idx2:]
          else:
              t = t.replace(old, new, 1)
          open(p, 'w').write(t)
          print('MainActivity.kt: VOICE_RECOGNITION + NS/AGC applied')
          PYEOF
          echo '--- diff overenie:'
          grep -n 'VOICE_RECOGNITION\|NoiseSuppressor\|threshold = 0.65' sherpa-onnx/kotlin-api/Vad.kt android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt

      - name: Add foreground service + wake lock (headless dictation)
        working-directory: src
        shell: bash
        run: |
          set -e
          python3 - << 'PYEOF'
          import os

          # 1) Vytvorit DiktatService.kt (foreground service + partial wake lock)
          svc_path = 'android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/DiktatService.kt'
          open(svc_path, 'w').write('''package com.k2fsa.sherpa.onnx.vad.asr

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.Intent
import android.os.Build
import android.os.IBinder
import android.os.PowerManager

class DiktatService : Service() {
    private var wakeLock: PowerManager.WakeLock? = null

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        val channelId = "diktat"
        if (Build.VERSION.SDK_INT >= 26) {
            val nm = getSystemService(NotificationManager::class.java)
            nm.createNotificationChannel(
                NotificationChannel(channelId, "Diktovanie", NotificationManager.IMPORTANCE_LOW)
            )
        }
        val builder = if (Build.VERSION.SDK_INT >= 26) {
            Notification.Builder(this, channelId)
        } else {
            @Suppress("DEPRECATION")
            Notification.Builder(this)
        }
        val notification = builder
            .setSmallIcon(android.R.drawable.ic_btn_speak)
            .setContentTitle("Diktovanie beží")
            .setContentText("Mikrofón aktívny - text sa zapisuje")
            .setOngoing(true)
            .build()
        startForeground(1, notification)

        if (wakeLock == null) {
            val pm = getSystemService(POWER_SERVICE) as PowerManager
            wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "skdiktat:wakelock").apply {
                setReferenceCounted(false)
                acquire(10 * 60 * 60 * 1000L)
            }
        }
        return START_STICKY
    }

    override fun onDestroy() {
        wakeLock?.let { if (it.isHeld) it.release() }
        wakeLock = null
        super.onDestroy()
    }

    override fun onBind(intent: Intent?): IBinder? = null
}
''')
          print('DiktatService.kt written')

          # 2) Manifest: povolenia + service
          mp = 'android/SherpaOnnxVadAsr/app/src/main/AndroidManifest.xml'
          m = open(mp).read()
          perm_anchor = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          assert perm_anchor in m, 'manifest permission anchor missing'
          m = m.replace(perm_anchor, perm_anchor + '''
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />''', 1)
          svc_decl = '''        <service
            android:name=".vad.asr.DiktatService"
            android:exported="false"
            android:foregroundServiceType="microphone" />
    </application>'''
          assert '</application>' in m, 'manifest application end missing'
          m = m.replace('</application>', svc_decl, 1)
          open(mp, 'w').write(m)
          print('AndroidManifest.xml patched')

          # 3) MainActivity: start/stop service spolu s nahravanim
          fp = 'android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt'
          t = open(fp).read()

          old_start = 'audioRecord!!.startRecording()'
          assert old_start in t, 'startRecording anchor missing'
          t = t.replace(old_start, old_start + '''
            val svc = android.content.Intent(this, DiktatService::class.java)
            if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)''', 1)

          old_stop = '''audioRecord!!.stop()
            audioRecord!!.release()'''
          assert old_stop in t, 'stop anchor missing'
          t = t.replace(old_stop, '''stopService(android.content.Intent(this, DiktatService::class.java))
            ''' + old_stop, 1)

          open(fp, 'w').write(t)
          print('MainActivity.kt patched (service start/stop)')
          PYEOF
          echo '--- overenie:'
          grep -n 'DiktatService\|FOREGROUND_SERVICE\|WAKE_LOCK' android/SherpaOnnxVadAsr/app/src/main/AndroidManifest.xml android/SherpaOnnxVadAsr/app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt | head -12

      - name: Copy native libs to jniLibs
        working-directory: src
        shell: bash
        run: |
          set -e
          ls -lh build-android-arm64-v8a/install/lib/*.so
          cp -v build-android-arm64-v8a/install/lib/*.so android/SherpaOnnxVadAsr/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle assembleRelease
        working-directory: src/android/SherpaOnnxVadAsr
        shell: bash
        run: |
          set -e
          sed -i.bak 's/2048/9012/g' gradle.properties
          ./gradlew assembleRelease --no-daemon

      - uses: actions/cache@v4
        with:
          path: keystore.jks
          key: sk-keystore-v1
          restore-keys: sk-keystore-

      - name: Sign APK
        shell: bash
        run: |
          set -e
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias sk -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass skpass123 -keypass skpass123 \
              -dname "CN=PeterGara, OU=SK, O=Personal, C=SK"
          fi
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          APK=$(find src/android/SherpaOnnxVadAsr/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "signing $APK with build-tools $BT"
          /usr/local/lib/android/sdk/build-tools/$BT/zipalign -f 4 "$APK" aligned.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner sign \
            --ks keystore.jks --ks-key-alias sk \
            --ks-pass pass:skpass123 --key-pass pass:skpass123 \
            --out sk-vad-asr.apk aligned.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner verify -v sk-vad-asr.apk | head -5
          ls -lh sk-vad-asr.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sk-vad-asr-apk
          path: sk-vad-asr.apk
          if-no-files-found: error
          retention-days: 90