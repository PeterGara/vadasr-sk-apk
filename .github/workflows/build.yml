name: build-speako-apk

on:
  workflow_dispatch:

concurrency:
  group: build-speako
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: src
          fetch-depth: 1

      - name: Checkout overrides
        uses: actions/checkout@v4
        with:
          path: ovr

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build native libs
        working-directory: src
        shell: bash
        run: |
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          ./build-android-arm64-v8a.sh

      - name: Apply overrides
        shell: bash
        run: |
          set -e
          A=src/android/SherpaOnnxVadAsr/app/src/main
          cp -v ovr/overrides/MainActivity.kt $A/java/com/k2fsa/sherpa/onnx/MainActivity.kt
          cp -v ovr/overrides/Settings.kt $A/java/com/k2fsa/sherpa/onnx/Settings.kt
          cp -v ovr/overrides/Translate.kt $A/java/com/k2fsa/sherpa/onnx/Translate.kt
          cp -v ovr/overrides/SettingsActivity.kt $A/java/com/k2fsa/sherpa/onnx/SettingsActivity.kt
          cp -v ovr/overrides/DiktatService.kt $A/java/com/k2fsa/sherpa/onnx/DiktatService.kt
          cp -v ovr/overrides/SpeakAccessibilityService.kt $A/java/com/k2fsa/sherpa/onnx/SpeakAccessibilityService.kt
          cp -v ovr/overrides/Theme.kt $A/java/com/k2fsa/sherpa/onnx/Theme.kt
          cp -v ovr/overrides/Engine.kt $A/java/com/k2fsa/sherpa/onnx/Engine.kt
          cp -v ovr/overrides/ThemeActivity.kt $A/java/com/k2fsa/sherpa/onnx/ThemeActivity.kt
          cp -v ovr/overrides/Layout.kt $A/java/com/k2fsa/sherpa/onnx/Layout.kt
          cp -v ovr/overrides/ButtonsActivity.kt $A/java/com/k2fsa/sherpa/onnx/ButtonsActivity.kt
          cp -v ovr/overrides/Menu.kt $A/java/com/k2fsa/sherpa/onnx/Menu.kt
          cp -v ovr/overrides/MenuActivity.kt $A/java/com/k2fsa/sherpa/onnx/MenuActivity.kt
          cp -v ovr/overrides/LlamaServer.kt $A/java/com/k2fsa/sherpa/onnx/LlamaServer.kt
          cp -v ovr/overrides/LlamaActivity.kt $A/java/com/k2fsa/sherpa/onnx/LlamaActivity.kt
          cp -v ovr/overrides/Engine.kt $A/java/com/k2fsa/sherpa/onnx/Engine.kt
          cp -v ovr/overrides/ThemeActivity.kt $A/java/com/k2fsa/sherpa/onnx/ThemeActivity.kt
          rm -f $A/java/com/k2fsa/sherpa/onnx/ApiClient.kt
          cp -v ovr/overrides/activity_main.xml $A/res/layout/activity_main.xml
          cp -v ovr/overrides/activity_settings.xml $A/res/layout/activity_settings.xml
          cp -v ovr/overrides/dialog_trim.xml $A/res/layout/dialog_trim.xml
          cp -v ovr/overrides/records_row.xml $A/res/layout/records_row.xml
          cp -v ovr/overrides/spinner_item.xml $A/res/layout/spinner_item.xml
          cp -v ovr/overrides/accessibility_service_config.xml $A/res/xml/accessibility_service_config.xml
          cp -v ovr/overrides/file_paths.xml $A/res/xml/file_paths.xml
          mkdir -p $A/res/drawable
          cp -v ovr/overrides/drawable/*.xml $A/res/drawable/
          cp -v ovr/overrides/AndroidManifest.xml $A/AndroidManifest.xml
          cp -v ovr/app_build.gradle src/android/SherpaOnnxVadAsr/app/build.gradle

      - name: Stiahnut Silero VAD do assets
        working-directory: src
        shell: bash
        run: |
          set -e
          A=$PWD/android/SherpaOnnxVadAsr/app/src/main/assets
          curl -SL --retry 3 -o $A/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

      - name: Copy native libs to jniLibs
        working-directory: src
        shell: bash
        run: |
          set -e
          cp -v build-android-arm64-v8a/install/lib/*.so android/SherpaOnnxVadAsr/app/src/main/jniLibs/arm64-v8a/
          # llama.cpp binarky - stiahni z release
          mkdir -p /tmp/llama
          curl -SL --retry 5 --retry-delay 3 -o /tmp/llama.tar.gz \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/PeterGara/vadasr-sk-apk/releases/assets/722597688
          SZ=$(stat -c%s /tmp/llama.tar.gz)
          echo "llama tar.gz: $SZ B"
          [ "$SZ" -gt 50000000 ] || { echo "CHYBA: llama tar.gz je len $SZ B"; exit 1; }
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          cp -v /tmp/llama/*.so android/SherpaOnnxVadAsr/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle assembleRelease
        working-directory: src/android/SherpaOnnxVadAsr
        shell: bash
        run: |
          set -e
          sed -i.bak 's/2048/9012/g' gradle.properties
          ./gradlew assembleRelease --no-daemon

      - uses: actions/cache@v4
        with:
          path: keystore.jks
          key: sk-keystore-v1
          restore-keys: sk-keystore-

      - name: Sign APK
        shell: bash
        run: |
          set -e
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias sk -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass skpass123 -keypass skpass123 \
              -dname "CN=PeterGara, OU=SK, O=Personal, C=SK"
          fi
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          APK=$(find src/android/SherpaOnnxVadAsr/app/build/outputs/apk/release -name '*.apk' | head -1)
          /usr/local/lib/android/sdk/build-tools/$BT/zipalign -f 4 "$APK" aligned.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner sign \
            --ks keystore.jks --ks-key-alias sk \
            --ks-pass pass:skpass123 --key-pass pass:skpass123 \
            --out speako.apk aligned.apk
          ls -lh speako.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: speako-apk
          path: speako.apk
          if-no-files-found: error
          retention-days: 90