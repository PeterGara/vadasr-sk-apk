name: build-sk-vad-asr-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: sk-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout sherpa-onnx
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          path: src
          fetch-depth: 1

      - name: Checkout overrides (SK APK custom sources)
        uses: actions/checkout@v4
        with:
          path: ovr

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Display NDK
        shell: bash
        run: echo "NDK=${ANDROID_NDK_LATEST_HOME}" && ls -d ${ANDROID_NDK_LATEST_HOME}

      - name: Build native libs (arm64-v8a)
        working-directory: src
        shell: bash
        run: |
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME
          cmake --version
          ./build-android-arm64-v8a.sh

      - name: Apply overrides (full replacement - no fragile patching)
        shell: bash
        run: |
          set -e
          A=src/android/SherpaOnnxVadAsr/app/src/main
          cp -v ovr/overrides/MainActivity.kt $A/java/com/k2fsa/sherpa/onnx/MainActivity.kt
          cp -v ovr/overrides/DiktatService.kt $A/java/com/k2fsa/sherpa/onnx/DiktatService.kt
          cp -v ovr/overrides/activity_main.xml $A/res/layout/activity_main.xml
          cp -v ovr/overrides/AndroidManifest.xml $A/AndroidManifest.xml
          grep -c 'type = 40' $A/java/com/k2fsa/sherpa/onnx/MainActivity.kt
          grep -c 'DiktatService' $A/AndroidManifest.xml

      - name: Insert SK Parakeet model into assets
        working-directory: src
        shell: bash
        run: |
          set -e
          A=$PWD/android/SherpaOnnxVadAsr/app/src/main/assets
          D=$A/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
          mkdir -p $D
          BASE=https://huggingface.co/vibeide-dev/parakeet-tdt-0.6b-v3-sk-sherpa-onnx-int8/resolve/main
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt; do
            curl -SL --retry 3 -o $D/$f $BASE/$f
          done
          curl -SL --retry 3 -o $A/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          SZ=$(stat -c%s $D/encoder.int8.onnx)
          [ "$SZ" -gt 650000000 ] || { echo "CHYBA encoder $SZ"; exit 1; }
          echo "encoder OK: $SZ"

      - name: Copy native libs to jniLibs
        working-directory: src
        shell: bash
        run: |
          set -e
          cp -v build-android-arm64-v8a/install/lib/*.so android/SherpaOnnxVadAsr/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle assembleRelease
        working-directory: src/android/SherpaOnnxVadAsr
        shell: bash
        run: |
          set -e
          sed -i.bak 's/2048/9012/g' gradle.properties
          ./gradlew assembleRelease --no-daemon

      - uses: actions/cache@v4
        with:
          path: keystore.jks
          key: sk-keystore-v1
          restore-keys: sk-keystore-

      - name: Sign APK
        shell: bash
        run: |
          set -e
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -alias sk -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass skpass123 -keypass skpass123 \
              -dname "CN=PeterGara, OU=SK, O=Personal, C=SK"
          fi
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          APK=$(find src/android/SherpaOnnxVadAsr/app/build/outputs/apk/release -name '*.apk' | head -1)
          /usr/local/lib/android/sdk/build-tools/$BT/zipalign -f 4 "$APK" aligned.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner sign \
            --ks keystore.jks --ks-key-alias sk \
            --ks-pass pass:skpass123 --key-pass pass:skpass123 \
            --out sk-vad-asr.apk aligned.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner verify -v sk-vad-asr.apk | head -3
          ls -lh sk-vad-asr.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sk-vad-asr-apk
          path: sk-vad-asr.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to Release (public download, no token)
        uses: softprops/action-gh-release@v2
        with:
          tag: build-${{ github.run_number }}
          name: SK diktat build ${{ github.run_number }}
          files: sk-vad-asr.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
